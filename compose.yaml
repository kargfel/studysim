# Studiums-Simulator auf dem Homeserver (Anleitung: docs/HOSTING.md)
#   docker compose up -d --build
# Erreichbar auf Port 2223 des Servers; Traefik leitet studysim.felixkarg.de dorthin weiter.
# Eigene Anpassungen NICHT hier, sondern in compose.override.yaml (wird automatisch
# mitgelesen und ist nicht versioniert) – sonst blockieren sie spätere Updates per git pull.
services:
  studysim:
    build: .
    image: studysim:latest
    container_name: studysim
    restart: unless-stopped
    environment:
      PORT: "2223"
    ports:
      - "2223:2223"
    # Härtung: der Server schreibt nichts und braucht keine Rechte
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    # Logs rotieren (Standard-Treiber json-file wächst sonst unbegrenzt)
    logging:
      driver: local

# ── Alternative: Traefik über Docker-Labels statt File-Provider ──────────────
# In compose.override.yaml (Netzname anpassen, hier "proxy"; `!reset` ab Compose 2.24):
