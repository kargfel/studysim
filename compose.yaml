# Studiums-Simulator auf dem Homeserver (Anleitung: docs/HOSTING.md)
#   docker compose up -d --build
# Erreichbar auf Port 2223 des Servers; Traefik leitet studysim.felixkarg.de dorthin weiter.
services:
  studysim:
    build: .
    image: studysim:latest
    container_name: studysim
    restart: unless-stopped
    environment:
      PORT: "2223"
    ports:
      - "2223:2223"
    # Härtung: der Server schreibt nichts und braucht keine Rechte
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # ── Alternative: Traefik über Docker-Labels statt File-Provider ──────────
    # Dann den Abschnitt "ports" oben entfernen und den Container in Traefiks
    # Docker-Netz hängen (Netzname anpassen, hier "proxy"):
    #
    # networks:
    #   - proxy
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.studysim.rule=Host(`studysim.felixkarg.de`)
    #   - traefik.http.routers.studysim.entrypoints=web
    #   - traefik.http.services.studysim.loadbalancer.server.port=2223

